{% extends 'base.html' %}

{% block title %}<title>Сервис рассылок. Удаление сообщения.</title>{% endblock %}

{% block content %}
<div class="container mt-5">
    <h3>Удаление сообщения: "{{ message.title }}"</h3>
    <p>Вы уверены, что хотите удалить это сообщение?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:message_detail' message.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
