{% extends 'base.html' %}

{% block title %}<title>Сервис рассылок. Создание нового сообщения.</title>{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Создать новое сообщение</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailing:messages' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
