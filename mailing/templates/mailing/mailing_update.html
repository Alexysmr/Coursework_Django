{% extends 'base.html' %}

{% block title %}<title>Редактирование рассылки</title>{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Редактировать рассылку</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailing:mailing_detail' mailing.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
