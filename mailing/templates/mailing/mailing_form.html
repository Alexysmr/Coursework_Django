{% extends 'base.html' %}

{% block title %}<title>Сервис рассылок. Создание рассылки</title>{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Создание рассылки</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Создать</button>
        <a href="{% url 'mailing:index' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
