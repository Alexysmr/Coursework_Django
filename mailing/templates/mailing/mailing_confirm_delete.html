{% extends 'base.html' %}

{% block title %}<title>Сервис рассылок. Удаление рассылки.</title>{% endblock %}

{% block content %}
<div class="container mt-5">
    <h3>Удаление рассылки: "{{ mailing.title }}"</h3>
    <p>Вы уверены, что хотите удалить эту рассылку?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:mailing_detail' mailing.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
