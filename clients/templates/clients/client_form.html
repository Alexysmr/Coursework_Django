{% extends 'base.html' %}

{% block title %}<title>Создание записи о клиенте</title>{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Создание записи о клиенте</h2>

    <form method="post" class="col-md-6">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Создать</button>
        <a href="{% url 'clients:index' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
