<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис рассылок. Вход в систему.</title>
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h3 class="text-center mb-4">Вход</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary btn-sm ms-2">Забыли пароль?</a>
                <a href="{% url 'users:registration' %}" class="btn btn-outline-secondary btn-sm ms-3">Зарегистрироваться</a>
                <a href="{% url 'contacts:index' %}" class="btn btn-secondary btn-sm ms-3">Контакты</a><br>
                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
