<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h4 class="text-center mb-4">Восстановление пароля</h4>
            <p class="text-muted">Введите ваш email. Мы отправим ссылку для сброса пароля.</p>
            <form method="post" action="{% url 'users:password_reset' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Отправить</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}">Вернуться на вход</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
